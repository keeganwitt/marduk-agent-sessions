[workspace]
members = ["crates/marduk-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Keegan Witt <keeganwitt@gmail.com>"]
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Scanning parses gigabytes of JSON; unoptimized, a dev-build scan is ~10x slower than release.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.marduk-core]
opt-level = 3
