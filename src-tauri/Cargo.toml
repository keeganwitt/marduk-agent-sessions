[package]
name = "marduk"
description = "Find and clean up old AI coding-agent sessions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which Cargo needs on Windows.
name = "marduk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marduk-core = { path = "../crates/marduk-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
